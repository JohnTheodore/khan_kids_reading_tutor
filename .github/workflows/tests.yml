name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Privacy gate
        env:
          KHAN_PRIVACY_KEY: ${{ secrets.KHAN_PRIVACY_KEY }}
          KHAN_PRIVACY_FINGERPRINTS: ${{ secrets.KHAN_PRIVACY_FINGERPRINTS }}
        run: python tools/audit_student_privacy.py --history
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick
          python -m pip install ruff==0.16.6 playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Repository quality gate
        run: ./tools/check-before-push
