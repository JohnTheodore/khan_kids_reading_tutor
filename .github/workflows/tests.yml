name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Privacy gate
        env:
          KHAN_PRIVACY_KEY: ${{ secrets.KHAN_PRIVACY_KEY }}
          KHAN_PRIVACY_FINGERPRINTS: ${{ secrets.KHAN_PRIVACY_FINGERPRINTS }}
        run: python tools/audit_student_privacy.py --history
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick
          python -m pip install ruff
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v
