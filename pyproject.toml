[project]
name = "khan-kids-reading-tutor"
version = "0.1.0"
description = "State-checked Khan Kids reading mastery automation"
requires-python = ">=3.11"
dependencies = ["uiautomator2==3.7.0"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "ruff==0.16.6",
]
